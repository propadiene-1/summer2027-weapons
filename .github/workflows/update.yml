name: Sync from upstream

on:
  schedule:
    - cron: "0 13 * * *"    # daily 9AM EST / 6AM PST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["annotations.yaml", "scripts/**"]
  

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Regenerate README from upstream + annotations
        run: python scripts/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "sync: $(date -u +%F)"
          git push
