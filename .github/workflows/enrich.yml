name: Add annotations

on:
  schedule:
    - cron: "0 14 * * 0"   # weekly, Sundays 14:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new companies to check"
        default: "25"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Check new companies against USAspending
        run: python scripts/enrich.py --limit "${{ github.event.inputs.limit || '25' }}"

      - name: Commit suggestions and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add suggested_annotations.yaml checked_companies.yaml
          git diff --cached --quiet || git commit -m "enrich: new suggestions $(date -u +%F)"
          git push
